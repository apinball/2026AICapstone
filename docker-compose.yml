services:
  ai-server:
    build:
      context: ./ai-server
      dockerfile: Dockerfile
    container_name: ai-server
    ports:
      - "8000:8000"
    volumes:
      - ./ai-server/app:/app
      - ai-models:/app/model_weights
      - hf-cache:/root/.cache/huggingface
      - whisper-cache:/root/.cache/whisper
    environment:
      - DEVICE=${DEVICE:-cpu}
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-base}
      - HF_TOKEN=${HF_TOKEN:-}
      # Track D (Rupture 감지) LLM
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:14b}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-6}
    depends_on:
      - ollama
    networks:
      - capstone-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - AI_SERVER_URL=http://ai-server:8000
      - AWS_REGION=${AWS_REGION:-ap-northeast-2}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-capstone-audio-bucket}
      - DYNAMODB_TABLE=${DYNAMODB_TABLE:-counseling-sessions}
      - USE_LOCAL=${USE_LOCAL:-true}
      - ENABLE_RUPTURE_DETECTION=${ENABLE_RUPTURE_DETECTION:-false}
      - SELF_INTERNAL_URL=${SELF_INTERNAL_URL:-http://web:3000}
    depends_on:
      - ai-server
    volumes:
      - web-local-storage:/app/backend/local-storage
    networks:
      - capstone-net

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - capstone-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  capstone-net:
    driver: bridge

volumes:
  ai-models:
  web-local-storage:
  hf-cache:
  whisper-cache:
  ollama-models:
